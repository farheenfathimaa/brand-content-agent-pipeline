# 20 golden briefs for the eval harness. All brands, products, and briefs are
# fictional. `stress_test: true` makes the mock LLM inject an unsupported claim
# and omit disclaimers so the revision loop and guardrails are exercised.
briefs:
  - id: gb-01
    title: Sparkling Citrus launch post
    vertical: food_beverage
    fact_sheet_id: ag-sparkling-citrus
    languages: [hi, es, de, fr]
    brief: >-
      Write a 120-word launch post introducing Alder Grove Sparkling Citrus.
      Emphasize no added sugar, natural citrus flavor, and recyclable cans.
      End with the required allergen disclaimer.
    stress_test: false

  - id: gb-02
    title: Sparkling Citrus shelf talker
    vertical: food_beverage
    fact_sheet_id: ag-sparkling-citrus
    languages: [hi, es, de, fr]
