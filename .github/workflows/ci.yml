name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests, lint, and mock eval (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Run golden-brief eval in mock mode
        run: python -m app.evals.runner --output-dir reports

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: reports/
          if-no-files-found: error

  docker:
    name: Docker build and health check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t brand-content-agent-pipeline:ci .

      - name: Start container and wait for health
        run: |
          docker run -d --name bcap-ci -p 8000:8000 -e APP_MODE=mock brand-content-agent-pipeline:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Container is healthy."
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy."
          docker logs bcap-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f bcap-ci || true
