[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-content-agent-pipeline"
version = "1.0.0"
description = "Fictional-brand content pipeline with guardrails, human approval, translation checks, and a local CMS. Runs key-free in mock mode."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brand Content Agent Pipeline contributors" }]
keywords = ["content", "agents", "guardrails", "llm", "fastapi", "evals"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyYAML>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "litellm>=1.50,<2.0",
  "Pillow>=10.4,<14.0",
]

[project.optional-dependencies]
design = ["playwright>=1.47,<2.0"]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.7,<1.0",
]

[project.urls]
Homepage = "https://github.com/farheenfathimaa/brand-content-agent-pipeline"
Issues = "https://github.com/farheenfathimaa/brand-content-agent-pipeline/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "data/*.yaml",
  "guardrails/rules/*.yaml",
  "prompts/*.yaml",
  "prompts/*.md",
  "prompts/*/*.yaml",
  "evals/*.yaml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "E501",
  # FastAPI dependency injection is idiomatic in argument defaults.
  "B008",
  # `class X(str, Enum)` is intentional for JSON/Pydantic compatibility.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
